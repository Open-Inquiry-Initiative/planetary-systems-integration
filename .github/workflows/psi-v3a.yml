name: PSI-001 V3-A fixture verification
on:
  push:
    branches: [psi-001-v0.3.0-coordination-identification]
  pull_request:
    paths:
      - 'research/psi001/v0.3.0/**'
      - '.github/workflows/psi-v3a.yml'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V3-A deterministic fixture tests
        run: python -m unittest discover -s research/psi001/v0.3.0/development -p 'test_v3a*.py' -v
